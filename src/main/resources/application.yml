server:
  port: 9999
  servlet:
    context-path: /

spring:
  application:
    name: UserService
  cloud:
    compatibility-verifier:
      enabled: false
  boot:
    admin:
      client:
        url: http://localhost:8081
        instance:
          service-base-url: http://localhost:9999
          prefer-ip: false
          metadata:
            unique-name: UserService
            service-type: business
  main:
    allow-bean-definition-overriding: true
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
  mvc:
    pathmatch:
      matching-strategy: path_pattern_parser

info:
  app:
    name: UserService
    type: business
    port: 9999

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: UserService

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: UserService:9999
    prefer-ip-address: false
    hostname: localhost
    metadata-map:
      unique-name: UserService
      service-type: business
      port: 9999
      management.context-path: /actuator

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /**
